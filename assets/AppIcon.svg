<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Data Analyzer app icon. macOS Big Sur-style rounded square: a quiet
    slate-blue surface with a floating data card. The card shows the two things
    the app is about: a grid of rows and a column histogram in the accent blue.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A59"/>
      <stop offset="1" stop-color="#151B2C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#2F6BE0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="92" y="92" width="840" height="840" rx="188"/>
    </clipPath>
  </defs>

  <!-- Rounded-square body (the 824px macOS icon grid inside the 1024 canvas) -->
  <g clip-path="url(#squircle)">
    <rect x="92" y="92" width="840" height="840" fill="url(#bg)"/>
    <!-- Faint grid lines in the background, like ruled paper -->
    <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2">
      <path d="M92 272H932M92 392H932M92 512H932M92 632H932M92 752H932"/>
      <path d="M272 92V932M392 92V932M512 92V932M632 92V932M752 92V932"/>
    </g>
    <rect x="92" y="92" width="840" height="840" fill="url(#sheen)"/>
  </g>

  <!-- Floating data card -->
  <g filter="url(#shadow)">
    <rect x="212" y="236" width="600" height="552" rx="44" fill="url(#card)"/>
  </g>

  <!-- Header row -->
  <rect x="212" y="236" width="600" height="92" rx="44" fill="#E3E8F2"/>
  <rect x="212" y="292" width="600" height="36" fill="#E3E8F2"/>
  <g fill="#8B95AB">
    <rect x="262" y="270" width="104" height="22" rx="11"/>
    <rect x="404" y="270" width="150" height="22" rx="11"/>
    <rect x="594" y="270" width="80" height="22" rx="11"/>
  </g>

  <!-- Rows: text cells in muted gray -->
  <g fill="#C3CAD8">
    <rect x="262" y="370" width="104" height="18" rx="9"/>
    <rect x="262" y="440" width="104" height="18" rx="9"/>
    <rect x="262" y="510" width="104" height="18" rx="9"/>
    <rect x="262" y="580" width="104" height="18" rx="9"/>
    <rect x="262" y="650" width="104" height="18" rx="9"/>
    <rect x="262" y="720" width="104" height="18" rx="9"/>
    <rect x="404" y="370" width="150" height="18" rx="9"/>
    <rect x="404" y="440" width="112" height="18" rx="9"/>
    <rect x="404" y="510" width="150" height="18" rx="9"/>
    <rect x="404" y="580" width="96" height="18" rx="9"/>
    <rect x="404" y="650" width="150" height="18" rx="9"/>
    <rect x="404" y="720" width="128" height="18" rx="9"/>
  </g>

  <!-- Row separators -->
  <g stroke="#E7EBF3" stroke-width="2">
    <path d="M232 414H792M232 484H792M232 554H792M232 624H792M232 694H792"/>
  </g>

  <!-- Column histogram in the accent blue: the numbers column, visualised -->
  <g fill="url(#bar)">
    <rect x="594" y="704" width="28" height="44" rx="6"/>
    <rect x="632" y="632" width="28" height="116" rx="6"/>
    <rect x="670" y="528" width="28" height="220" rx="6"/>
    <rect x="708" y="584" width="28" height="164" rx="6"/>
    <rect x="746" y="664" width="28" height="84" rx="6"/>
  </g>
</svg>
