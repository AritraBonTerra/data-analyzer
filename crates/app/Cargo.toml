[package]
name = "data-analyzer"
version = "0.1.0"
edition = "2024"
description = "A fast, native viewer for CSV, Excel, Parquet and JSON files."

[[bin]]
name = "data-analyzer"
path = "src/main.rs"

[dependencies]
da-core = { path = "../core" }
gpui-kit = { version = "=0.8.1", features = ["syntect"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
