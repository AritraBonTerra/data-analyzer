# Builds, signs, notarizes and publishes a release when a tag v<version> is pushed.
# A tag v<version>-dryrun.<n> runs every step except publishing, and keeps the
# DMG and latest.json as workflow artifacts instead.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; a second tag waits instead of cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      # Full history: bundle.sh numbers builds with `git rev-list --count HEAD`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag against the app version
        id: tag
        run: scripts/release-tag.sh "$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"

      # A real release must be a commit that is in main; a trial run can be anywhere.
      - name: Check the tag is on main
        env:
          DRY_RUN: ${{ steps.tag.outputs.dry_run }}
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tagged commit is in main."
          elif [[ "$DRY_RUN" == false ]]; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge first, then tag main."
            exit 1
          else
            echo "Tagged commit is not in main (trial run, so that is fine)."
          fi

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      # Release profile throughout, so DuckDB compiles once for the checks and the bundle.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      # Normally about 8 minutes. The limit stops a hung test from holding the run for hours.
      - run: cargo test --workspace --release
        timeout-minutes: 30

      # Puts the Developer ID certificate in a throwaway keychain, made the default so
      # bundle.sh finds the identity and notarytool finds the `data-analyzer` profile.
      # The runner is discarded after the job, keychain included.
      - name: Load the signing certificate and notary key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -s "$keychain"

          # Apple's intermediate, in case the export left it out.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/ca.cer"
          security import "$RUNNER_TEMP/ca.cer" -k "$keychain"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain"

          printf '%s\n' "$NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials data-analyzer --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      # Signs with the Developer ID loaded above; Apple notarizes the app and DMG
      # and both get the ticket stapled, so macOS opens them without a warning.
      - name: Build, sign and notarize app and DMG
        run: scripts/bundle.sh --notarize

      - name: Sign DMG and write latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          key=$(mktemp) # created with mode 600
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key"
          scripts/release-manifest.sh "dist/Data-Analyzer-$VERSION.dmg" "$VERSION" "$key" \
            packaging/update-key.pub >dist/latest.json
          cat dist/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/Data-Analyzer-${{ steps.tag.outputs.version }}.dmg
            dist/latest.json
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "Data-Analyzer-$VERSION.dmg" latest.json
