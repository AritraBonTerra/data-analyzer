# Builds, signs and publishes a release when a tag v<version> is pushed.
# A tag v<version>-dryrun.<n> runs every step except publishing, and keeps the
# DMG and latest.json as workflow artifacts instead.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; a second tag waits instead of cancelling the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      # Full history: bundle.sh numbers builds with `git rev-list --count HEAD`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag against the app version
        id: tag
        run: scripts/release-tag.sh "$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      # Release profile throughout, so DuckDB compiles once for the checks and the bundle.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release

      # Signed ad hoc. For Developer ID signing and notarization, import the
      # certificate from secrets here, set SIGN_IDENTITY to it and pass --notarize.
      - name: Build app and DMG
        run: SIGN_IDENTITY=- scripts/bundle.sh

      - name: Sign DMG and write latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          key=$(mktemp) # created with mode 600
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key"
          scripts/release-manifest.sh "dist/Data-Analyzer-$VERSION.dmg" "$VERSION" "$key" \
            packaging/update-key.pub >dist/latest.json
          cat dist/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/Data-Analyzer-${{ steps.tag.outputs.version }}.dmg
            dist/latest.json
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "Data-Analyzer-$VERSION.dmg" latest.json
